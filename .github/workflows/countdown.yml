name: SHAM countdown

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "capture — получить пост; preview — просмотр; update — обновить"
        type: choice
        required: true
        default: capture
        options:
          - capture
          - preview
          - update
  schedule:
    - cron: '2/5 * * * *'

permissions:
  contents: read

concurrency:
  group: sham-countdown
  cancel-in-progress: false

jobs:
  countdown:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Countdown
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ENABLE_COUNTDOWN: ${{ vars.ENABLE_COUNTDOWN }}
          MODE: ${{ inputs.mode || 'update' }}
        run: |
          case "$MODE" in
            capture) python countdown.py --capture ;;
            preview) python countdown.py --preview ;;
            update) python countdown.py ;;
            *) exit 1 ;;
          esac

      - name: Save post template
        if: ${{ inputs.mode == 'capture' }}
        uses: actions/upload-artifact@v4
        with:
          name: post-template
          path: post_template.json
          if-no-files-found: error
          retention-days: 1
